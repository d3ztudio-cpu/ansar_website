    /* Boot bar: a slim indeterminate progress line at the very top. It lives
       OUTSIDE #root so React can never wipe it abruptly — it fades itself out

    #boot-splash {
      position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 9998;
      background: linear-gradient(90deg, #059669 0%, #34d399 40%, #fbbf24 100%);
      background-size: 50% 100%;
      transform-origin: left;
      animation: boot-slide 1.1s ease-in-out infinite;
      opacity: 1; transition: opacity 250ms ease-out;
    }
    #boot-splash.is-hidden { opacity: 0; pointer-events: none; }
    @keyframes boot-slide {
      0% { background-position: -50% 0; }
      100% { background-position: 150% 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash { animation: none; opacity: 0.6; }
      #boot-splash.is-hidden { transition: none; }
    }
  </style>
